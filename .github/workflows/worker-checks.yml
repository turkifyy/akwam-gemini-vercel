name: Worker checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build and verify the tracked bundle
        working-directory: worker
        run: |
          npm run bundle
          git diff --exit-code -- bundle.js
      - name: Run Worker tests
        working-directory: worker
        run: npm test
      - name: Check JavaScript syntax
        working-directory: worker
        run: npm run check

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.CLOUDFLARE_WORKER_AUTO_DEPLOY == 'true' }}
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy Cloudflare Worker
        working-directory: worker
        run: npx --yes wrangler@4.36.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
